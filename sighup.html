<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل حساب جديد - HEAVY EQUIPMENT</title>
    <link rel="stylesheet" href="login.css">
    <link rel="icon" type="img" href="logo.jpg">
</head>
<body>
    <div class="img">
        <div class="content">
            <h2>تسجيل جديد</h2>   
            <form action="page 1.html">
                <!-- اسم المستخدم -->
                <div class="filed">
                    <input type="text" required placeholder="اسم المستخدم">
                </div>

                <!-- البريد الإلكتروني -->
                <div class="filed space">
                    <input type="email" required placeholder="البريد الإلكتروني">
                </div>

                <!-- كلمة المرور -->
                <div class="filed space">
                    <input type="password" class="pass-key" required placeholder="كلمة المرور">
                    <span class="show">اظهر</span>             
                </div>

                <!-- تأكيد كلمة المرور -->
                <div class="filed space">
                    <input type="password" class="pass-key2" required placeholder="تأكيد كلمة المرور">
                </div>

                <!-- زر التسجيل -->
                <div class="field1">
                    <input type="submit" value="إنشاء حساب">
                </div>
            </form>  

            <!-- رابط العودة لصفحة تسجيل الدخول -->
            <div class="signup"> لديك حساب بالفعل؟
                <a href="loge in.html">تسجيل الدخول</a>
            </div>

        </div>
    </div>
    <script type="text/javascript" src="login.js"></script>
</body>
</html>
